<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not on the shelf - Saxton Showcase</title>
<style>
@font-face{font-family:"Unbounded";src:url(/fonts/Unbounded.woff2) format("woff2");font-weight:700 800;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(/fonts/AtkinsonHyperlegible-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(/fonts/AtkinsonHyperlegible-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{color-scheme:light;--night:#F7F4FF;--ink:#1A1540;--muted:#524A78;--lav:#6B4FD8;--tomato:#FF4F6D}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;color:var(--ink);background:var(--night)}
main{max-width:560px;margin:0 auto;padding:56px 16px}
h1{font-family:"Unbounded","Arial Black",system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.15;margin:0 0 12px;text-wrap:balance}
p{margin:0 0 14px}
.tag{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.03em;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:#fff;margin-bottom:18px}
a.btn{display:inline-block;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 16px;text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
a.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
a.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
:focus-visible{outline:2px solid var(--lav);outline-offset:3px}
.muted{color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
<main>
  <span class="tag">404</span>
  <h1>That one is not on the shelf.</h1>
  <p>The link may be old, or the piece was taken down.</p>
  <p><a class="btn" href="/">See what is on the shelf</a></p>
  <p class="muted">Saxton Showcase</p>
</main>
</body>
</html>
