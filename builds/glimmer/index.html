<!--
  GLIMMER
  builds/glimmer/index.html
  Built 2026-09-23. Self-contained: no dependencies, no network, opens offline from the file system.

  WHAT IT IS
  A match three puzzle on an 8 by 8 board of six gems. Every gem has its own shape as well as its
  own colour (star, heart, triangle, hexagon, diamond, circle), so the board reads without colour.
  Swap two neighbours to line up three or more. Only swaps that make a line are allowed; a bad swap
  bounces back. Cleared gems fall, new ones drop in, and every cascade raises the combo multiplier.
  Line up four and you get a Blaster that clears its row (made from a row) or its column (made from
  a column) when it goes off. Line up five and you get a Prism: swap it with any gem to clear every
  gem of that colour. Twelve levels, each with a score target and a move limit that tighten as you
  go. Leftover moves pay a bonus. The board reshuffles itself when no move is left, and after five
  idle seconds two gems pulse as a hint.

  CONTROLS
  Pointer or touch: drag a gem onto a neighbour, or tap one gem and then a neighbour.
  Keyboard: arrow keys move the cursor, Enter picks a gem, then an arrow (or Enter on a neighbour)
  swaps. H shows a hint. P or Space pauses. M mutes. Enter or a tap starts and restarts.
  Escape is left alone for the page that hosts the game.
  ?preview=1 hides all chrome and runs a silent autopilot that picks legal swaps forever.

  HOW IT WAS CHECKED
  The board logic sits between CORE:BEGIN and CORE:END and has no DOM, so node loads exactly that
  block out of this file. 47 unit assertions: run finding (rows, columns, gaps, L shapes, Prisms
  never matching), Blaster and Prism creation and placement, Blaster chains, Prism colour clears,
  gravity and refill, a hand-built two-step cascade scored at x2, no-moves detection on a board
  with no legal swap (confirmed by an independent brute force), shuffle, 300 fresh boards, and a
  2,400 move autopilot soak with zero illegal swaps and zero holes. Four planted bugs in a copy of
  the core (match needs four, no column Blaster, gravity skips a row, Prism never fires) each turn
  the suite red. The level table was tuned by playing 400 seeds per level with a random bot and
  with the greedy autopilot.
  Headless Chrome (Playwright) drives the page: 1280x720 with real keys and mouse (illegal swap
  bounces with no move spent, keyboard, drag and click swaps score, hint after idle, P, Space,
  blur, M, game over, localStorage best, instant restart, level advance, Escape not prevented);
  390x844 at 3x with real taps and a real touch drag (no scroll or zoom, mute and pause buttons,
  visibilitychange pause, game over, tap restart); a run with localStorage throwing; and
  ?preview=1 at 600x300 and 350x175 (frames change, no chrome, no storage, no audio, legal
  swaps only, restarts itself after a forced game over). Zero page or console errors throughout.
  window.__glimmer is the handle those checks read; they also use it to force a short move budget.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Glimmer</title>
<style>

    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1A1540; color: #fff;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;

  canvas#c { display: block; touch-action: none; outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

<body>
<canvas id="c" tabindex="0" aria-label="Glimmer, a match three puzzle. Arrow keys move, Enter picks and swaps."></canvas>
<div id="live" class="sr" aria-live="polite"></div>
<script>
"use strict";
/*CORE:BEGIN*/
/* Pure board logic. No DOM, no timers: the node tests load exactly this block. */
var Core = (function () {
  var N = 8, TYPES = 6, PRISM_T = 6;
  var S_NONE = 0, S_ROW = 1, S_COL = 2, S_PRISM = 3;
  var nextId = 1;

  function rngFrom(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gem(t, s) { return { id: nextId++, t: t, s: s || 0 }; }
  function idx(r, c) { return r * N + c; }
  function adjacent(a, b) {
    if (a < 0 || b < 0 || a >= N * N || b >= N * N) return false;
    return Math.abs((a >> 3) - (b >> 3)) + Math.abs((a & 7) - (b & 7)) === 1;
  }
  function colourOf(g) { return g && g.s !== S_PRISM ? g.t : -1; }

  function findRuns(board) {
    var runs = [], r, c, e, t, k, cells;
    for (r = 0; r < N; r++) {
      c = 0;
      while (c < N) {
        t = colourOf(board[idx(r, c)]); e = c + 1;
        if (t >= 0) while (e < N && colourOf(board[idx(r, e)]) === t) e++;
        if (t >= 0 && e - c >= 3) { cells = []; for (k = c; k < e; k++) cells.push(idx(r, k)); runs.push({ dir: "h", t: t, cells: cells }); }
        c = e;
      }
    }
    for (c = 0; c < N; c++) {
      r = 0;
      while (r < N) {
        t = colourOf(board[idx(r, c)]); e = r + 1;
        if (t >= 0) while (e < N && colourOf(board[idx(e, c)]) === t) e++;
        if (t >= 0 && e - r >= 3) { cells = []; for (k = r; k < e; k++) cells.push(idx(k, c)); runs.push({ dir: "v", t: t, cells: cells }); }
        r = e;
      }
    }
    return runs;
  }

  function matchAt(board, i) {
    var t = colourOf(board[i]); if (t < 0) return false;
    var r = i >> 3, c = i & 7, n = 1, k;
    for (k = c - 1; k >= 0 && colourOf(board[idx(r, k)]) === t; k--) n++;
    for (k = c + 1; k < N && colourOf(board[idx(r, k)]) === t; k++) n++;
    if (n >= 3) return true;
    n = 1;
    for (k = r - 1; k >= 0 && colourOf(board[idx(k, c)]) === t; k--) n++;
    for (k = r + 1; k < N && colourOf(board[idx(k, c)]) === t; k++) n++;
    return n >= 3;
  }

  function groupRuns(runs) {
    var parent = runs.map(function (_, i) { return i; });
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    var owner = {};
    runs.forEach(function (run, i) {
      run.cells.forEach(function (c) {
        if (owner[c] !== undefined) parent[find(i)] = find(owner[c]); else owner[c] = i;
      });
    });
    var groups = {}, order = [];
    runs.forEach(function (run, i) {
      var k = find(i);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(run);
    });
    return order.map(function (k) {
      var rs = groups[k], seen = {}, cells = [];
      rs.forEach(function (r) { r.cells.forEach(function (c) { if (!seen[c]) { seen[c] = 1; cells.push(c); } }); });
      return { runs: rs, cells: cells, t: rs[0].t };
    });
  }

  function planSpecial(group, prefer) {
    var best = group.runs[0], i, p;
    for (i = 1; i < group.runs.length; i++) if (group.runs[i].cells.length > best.cells.length) best = group.runs[i];
    var len = best.cells.length;
    if (len < 4) return null;
    var at = -1;
    for (i = 0; prefer && i < prefer.length && at < 0; i++) { p = prefer[i]; if (best.cells.indexOf(p) >= 0) at = p; }
    for (i = 0; prefer && i < prefer.length && at < 0; i++) { p = prefer[i]; if (group.cells.indexOf(p) >= 0) at = p; }
    if (at < 0) at = best.cells[(len - 1) >> 1];
    if (len >= 5) return { at: at, t: PRISM_T, s: S_PRISM };
    return { at: at, t: group.t, s: best.dir === "h" ? S_ROW : S_COL };
  }

  function commonColour(board, exclude) {
    var counts = [0, 0, 0, 0, 0, 0], k, t, best = -1, bn = 0;
    for (k = 0; k < N * N; k++) { if (exclude[k]) continue; t = colourOf(board[k]); if (t >= 0) counts[t]++; }
    for (t = 0; t < TYPES; t++) if (counts[t] > bn) { bn = counts[t]; best = t; }
    return best;
  }

  /* Clear a seed set, letting every special caught in it go off, chain style. */
  function expand(board, seed, fired) {
    fired = fired || {};
    var set = {}, list = [], queue = [], blasts = [], i, g, cells, kind, t, k;
    function add(c) { if (!set[c]) { set[c] = 1; list.push(c); queue.push(c); } }
    seed.forEach(add);
    while (queue.length) {
      i = queue.shift(); g = board[i];
      if (!g || !g.s || fired[i]) continue;
      fired[i] = 1; cells = []; t = -1;
      if (g.s === S_ROW) { kind = "row"; for (k = 0; k < N; k++) cells.push(idx(i >> 3, k)); }
      else if (g.s === S_COL) { kind = "col"; for (k = 0; k < N; k++) cells.push(idx(k, i & 7)); }
      else {
        kind = "prism"; t = commonColour(board, set);
        for (k = 0; k < N * N; k++) if (t >= 0 && colourOf(board[k]) === t) cells.push(k);
      }
      blasts.push({ kind: kind, at: i, t: t, cells: cells });
      cells.forEach(add);
    }
    return { cells: list, blasts: blasts };
  }

  function finish(board, seed, plans, groups, mult, fired, pre) {
    var ex = expand(board, seed, fired);
    var blasts = (pre || []).concat(ex.blasts);
    var removed = [], created = [];
    ex.cells.forEach(function (i) { if (board[i]) removed.push({ i: i, g: board[i] }); board[i] = null; });
    plans.forEach(function (p) { var g = gem(p.t, p.s); board[p.at] = g; created.push({ i: p.at, g: g }); });
    var pts = removed.length * 10;
    groups.forEach(function (gr) {
      var L = 0; gr.runs.forEach(function (r) { if (r.cells.length > L) L = r.cells.length; });
      if (L === 4) pts += 40; else if (L >= 5) pts += 100;
      if (gr.runs.length > 1) pts += 30;
    });
    pts += blasts.length * 50;
    return { removed: removed, created: created, blasts: blasts, groups: groups, points: pts * (mult || 1), mult: mult || 1 };
  }

  /* One cascade step: find every line, plan specials, clear. Returns null when the board is still. */
  function resolveStep(board, prefer, mult) {
    var runs = findRuns(board);
    if (!runs.length) return null;
    var groups = groupRuns(runs), plans = [], seed = [];
    groups.forEach(function (g) { var p = planSpecial(g, prefer); if (p) plans.push(p); seed.push.apply(seed, g.cells); });
    return finish(board, seed, plans, groups, mult, null, null);
  }

  /* A swap that involves a Prism. The swap has already been applied. */
  function resolvePrismSwap(board, a, b, mult) {
    var p = board[a] && board[a].s === S_PRISM ? a : b, o = p === a ? b : a;
    var fired = {}, seed = [p], t = -1, k;
    fired[p] = 1;
    if (board[o] && board[o].s === S_PRISM) {
      fired[o] = 1;
      for (k = 0; k < N * N; k++) if (board[k]) seed.push(k);
    } else {
      t = board[o].t;
      for (k = 0; k < N * N; k++) if (k !== p && colourOf(board[k]) === t) seed.push(k);
    }
    var pre = [{ kind: "prism", at: p, t: t, cells: seed.slice() }];
    return finish(board, seed, [], [], mult, fired, pre);
  }

  function isPrismSwap(board, a, b) {
    return !!(board[a] && board[b] && (board[a].s === S_PRISM || board[b].s === S_PRISM));
  }
  function applySwap(board, a, b) { var t = board[a]; board[a] = board[b]; board[b] = t; }
  function isLegalSwap(board, a, b) {
    if (!adjacent(a, b) || !board[a] || !board[b]) return false;
    if (isPrismSwap(board, a, b)) return true;
    applySwap(board, a, b);
    var ok = matchAt(board, a) || matchAt(board, b);
    applySwap(board, a, b);
    return ok;
  }

  /* Gravity then refill. Mutates the board; returns what moved for the animation. */
  function collapse(board, rng, types) {
    types = types || TYPES;
    var falls = [], spawns = [], c, r, w, i, g;
    for (c = 0; c < N; c++) {
      w = N - 1;
      for (r = N - 1; r >= 0; r--) {
        i = idx(r, c);
        if (board[i]) {
          if (r !== w) { g = board[i]; board[idx(w, c)] = g; board[i] = null; falls.push({ g: g, c: c, from: r, to: w }); }
          w--;
        }
      }
      for (r = w; r >= 0; r--) {
        g = gem((rng() * types) | 0);
        board[idx(r, c)] = g;
        spawns.push({ g: g, c: c, from: r - (w + 1), to: r });
      }
    }
    return { falls: falls, spawns: spawns };
  }

  function findMoves(board, firstOnly) {
    var out = [], i, j, r, c;
    for (i = 0; i < N * N; i++) {
      r = i >> 3; c = i & 7;
      var nb = [];
      if (c < N - 1) nb.push(i + 1);
      if (r < N - 1) nb.push(i + N);
      for (var q = 0; q < nb.length; q++) {
        j = nb[q];
        if (isLegalSwap(board, i, j)) { out.push({ a: i, b: j }); if (firstOnly) return out; }
      }
    }
    return out;
  }
  function hasMoves(board) { return findMoves(board, true).length > 0; }

  function fillFresh(rng, types) {
    types = types || TYPES;
    for (var tries = 0; tries < 500; tries++) {
      var board = new Array(N * N), i, r, c, t, guard;
      for (i = 0; i < N * N; i++) {
        r = i >> 3; c = i & 7; guard = 0;
        do {
          t = (rng() * types) | 0; guard++;
        } while (guard < 50 && ((c >= 2 && board[i - 1].t === t && board[i - 2].t === t) ||
                                (r >= 2 && board[i - N].t === t && board[i - 2 * N].t === t)));
        board[i] = gem(t);
      }
      if (!findRuns(board).length && hasMoves(board)) return board;
    }
    throw new Error("fillFresh: no playable board in 500 tries");
  }

  /* Rearrange the same gems until the board is still and has a move. */
  function shuffle(board, rng) {
    var gems = board.filter(Boolean), cells = [], i, k, tmp;
    for (i = 0; i < N * N; i++) if (board[i]) cells.push(i);
    for (var tries = 0; tries < 300; tries++) {
      for (i = gems.length - 1; i > 0; i--) { k = (rng() * (i + 1)) | 0; tmp = gems[i]; gems[i] = gems[k]; gems[k] = tmp; }
      cells.forEach(function (c, n) { board[c] = gems[n]; });
      if (!findRuns(board).length && hasMoves(board)) return "shuffled";
    }
    var fresh = fillFresh(rng);
    for (i = 0; i < N * N; i++) board[i] = fresh[i];
    return "fresh";
  }

  function evaluateMove(board, m) {
    var b = board.slice(), res;
    if (isPrismSwap(b, m.a, m.b)) { applySwap(b, m.a, m.b); res = resolvePrismSwap(b, m.a, m.b, 1); }
    else { applySwap(b, m.a, m.b); res = resolveStep(b, [m.b, m.a], 1); }
    if (!res) return -1;
    var v = res.points;
    res.created.forEach(function (c) { v += c.g.s === S_PRISM ? 260 : 110; });
    v += (N - (m.a >> 3)) * -2; /* slight preference for lower moves: they shake up more cascades */
    return v;
  }
  function bestMove(board, rng, noise) {
    var ms = findMoves(board), best = null, bv = -Infinity;
    ms.forEach(function (m) {
      var v = evaluateMove(board, m) + (rng ? rng() * (noise || 0) : 0);
      if (v > bv) { bv = v; best = m; }
    });
    return best;
  }

  /* Twelve levels: the target climbs and the move budget shrinks. Tuned in node against two bots over 400
     seeds each: a random legal mover clears level 1 about 98% of the time and level 12 about 13%;
     the greedy autopilot clears level 1 always and level 12 about half the time. */
  var LEVELS = [
    { name: "First Light", target: 900, moves: 20 },
    { name: "Candle Cove", target: 1100, moves: 20 },
    { name: "Marigold Meadow", target: 1300, moves: 20 },
    { name: "Pool Party", target: 1400, moves: 19 },
    { name: "Grape Arcade", target: 1550, moves: 19 },
    { name: "Bubble Row", target: 1650, moves: 18 },
    { name: "Tomato Tower", target: 1750, moves: 18 },
    { name: "Periwinkle Pier", target: 1800, moves: 17 },
    { name: "Sugar Stairs", target: 1900, moves: 17 },
    { name: "Glint Garden", target: 1950, moves: 16 },
    { name: "Moonstone Mile", target: 2050, moves: 16 },
    { name: "Crown of Glimmer", target: 2200, moves: 16 }
  ];

  function fromRows(rows) {
    var map = "abcdef", board = [], ch, k;
    rows.forEach(function (row) {
      for (k = 0; k < N; k++) {
        ch = row[k];
        if (ch === ".") board.push(null);
        else if (ch === "*") board.push(gem(PRISM_T, S_PRISM));
        else if (map.indexOf(ch) >= 0) board.push(gem(map.indexOf(ch), S_NONE));
        else if (map.toUpperCase().indexOf(ch) >= 0) board.push(gem(map.toUpperCase().indexOf(ch), S_ROW));
        else if ("123456".indexOf(ch) >= 0) board.push(gem("123456".indexOf(ch), S_COL));
        else throw new Error("bad cell " + ch);
      }
    });
    return board;
  }

  return {
    N: N, TYPES: TYPES, PRISM_T: PRISM_T, S_NONE: S_NONE, S_ROW: S_ROW, S_COL: S_COL, S_PRISM: S_PRISM,
    rngFrom: rngFrom, gem: gem, adjacent: adjacent, findRuns: findRuns, matchAt: matchAt, groupRuns: groupRuns,
    resolveStep: resolveStep, resolvePrismSwap: resolvePrismSwap, isPrismSwap: isPrismSwap, applySwap: applySwap,
    isLegalSwap: isLegalSwap, collapse: collapse, findMoves: findMoves, hasMoves: hasMoves, fillFresh: fillFresh,
    shuffle: shuffle, evaluateMove: evaluateMove, bestMove: bestMove, LEVELS: LEVELS, fromRows: fromRows
  };
})();
/*CORE:END*/

/* ------------------------------------------------------------------ *
 *  Setup
 * ------------------------------------------------------------------ */
var qs = new URLSearchParams(location.search);
var PREVIEW = qs.has("preview") && qs.get("preview") !== "0";
if (PREVIEW) { document.documentElement.classList.add("preview"); document.body.classList.add("preview"); }
var RM = false;
try { RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { RM = false; }

var COL = ["#FFE066", "#FF4F6D", "#C6F432", "#22D3C5", "#B45CF0", "#FF7AC8"];
var GEM_NAMES = ["star", "heart", "triangle", "hexagon", "diamond", "circle"];
var PERI = "#8C9BFF", INK = "#1A1540", PANEL = "#241D5A", PANEL2 = "#2B2369", DIM = "#B8B2EA";
var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

var cv = document.getElementById("c"), cx = cv.getContext("2d");
var liveEl = document.getElementById("live");
var W = 0, H = 0, DPR = 1, L = {}, sprites = [], bgCanvas = null;
var T = 0;                                   /* game clock, frozen while paused */
var P = [], POP = [];                        /* particles, floating text */
var shakeAmt = 0, flash = 0;
var screen = "title", paused = false, G = null, BTN = [];
var best = loadBest(), muted = loadMute();

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function easeOut(k) { return 1 - (1 - k) * (1 - k); }
function easeInOut(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
function easeBack(k) { var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); }
function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function mix(hex, other, k) {
  var a = parseInt(hex.slice(1), 16), b = parseInt(other.slice(1), 16);
  var r = Math.round(lerp(a >> 16, b >> 16, k)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, k)), bl = Math.round(lerp(a & 255, b & 255, k));
  return "rgb(" + r + "," + g + "," + bl + ")";
}
function say(t) { if (!PREVIEW && liveEl) liveEl.textContent = t; }

function loadBest() { try { var v = parseInt(localStorage.getItem("glimmer.best"), 10); return isFinite(v) ? v : 0; } catch (e) { return 0; } }
function saveBest() { if (PREVIEW) return; try { localStorage.setItem("glimmer.best", String(best)); } catch (e) { } }
function loadMute() { try { return localStorage.getItem("glimmer.mute") === "1"; } catch (e) { return false; } }
function saveMute() { if (PREVIEW) return; try { localStorage.setItem("glimmer.mute", muted ? "1" : "0"); } catch (e) { } }

/* ------------------------------------------------------------------ *
 *  Sound: all synthesized, nothing starts before the first input
 * ------------------------------------------------------------------ */
var AC = null, MG = null, lastLand = 0;
function unlockAudio() {
  if (PREVIEW) return;
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor(); MG = AC.createGain(); MG.gain.value = muted ? 0 : 0.5; MG.connect(AC.destination);
  } catch (e) { AC = null; }
}
function setMuted(m) {
  muted = m; saveMute();
  if (MG && AC) MG.gain.setTargetAtTime(muted ? 0 : 0.5, AC.currentTime, 0.02);
  say(muted ? "Sound off" : "Sound on");
}
function tone(f, dur, o) {
  if (!AC || muted) return;
  o = o || {};
  var t0 = AC.currentTime + (o.delay || 0), osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(f, t0);
